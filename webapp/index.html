<!doctype html>
<html lang="bn">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#100b1c">
  <title>E Premium</title>
  <script src="https://telegram.org/js/telegram-web-app.js?65"></script>
  <style>
    :root {
      color-scheme: dark;
      --bg: #100b1c;
      --surface-soft: #211832;
      --line: rgba(220, 197, 255, .105);
      --text: #fbf8ff;
      --muted: #a89bb9;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
      background:
        radial-gradient(ellipse at 92% 0%, rgba(144, 83, 220, .28), transparent 34%),
        radial-gradient(ellipse at 2% 55%, rgba(104, 53, 164, .16), transparent 33%), var(--bg);
    }
    button, textarea { font: inherit; }
    .app {
      display: flex;
      width: min(100%, 500px);
      min-height: 100vh;
      min-height: 100dvh;
      flex-direction: column;
      margin: 0 auto;
      padding: max(21px, env(safe-area-inset-top)) 21px max(19px, env(safe-area-inset-bottom));
    }
    .topbar { display: flex; align-items: center; justify-content: space-between; }
    .brand { display: flex; align-items: center; gap: 10px; }
    .logo { width: 39px; height: 39px; border-radius: 14px; box-shadow: 0 7px 22px #9860dd37; }
    .brand-name { font-size: 12px; font-weight: 780; letter-spacing: .13em; }
    .brand-note { margin-top: 2px; color: var(--muted); font-size: 9px; }
    main { flex: 1; padding-bottom: 14px; }
    .hero { padding: 40px 0 22px; }
    h1 { margin: 11px 0 10px; font-size: clamp(32px, 9vw, 42px); line-height: 1.15; letter-spacing: -.025em; font-weight: 735; }
    h1 span { color: transparent; background: linear-gradient(95deg, #cbaaff, #f0b2ec 78%); background-clip: text; }
    .intro { max-width: 355px; margin: 0; color: var(--muted); font-size: 12px; line-height: 1.7; }
    .section-head { display: flex; align-items: center; justify-content: space-between; margin: 2px 0 10px; }
    .section-title { color: #ded5e8; font-size: 10px; font-weight: 660; }
    .prompts { display: grid; grid-template-columns: 1fr 1fr; gap: 9px; }
    .prompt {
      min-height: 84px;
      padding: 13px;
      border: 1px solid var(--line);
      border-radius: 16px;
      color: var(--text);
      text-align: left;
      background: linear-gradient(145deg, #ffffff08, #ffffff03);
      transition: transform .15s, border-color .15s, background .15s;
      cursor: pointer;
    }
    .prompt:active { transform: scale(.98); border-color: #bd94ff76; background: #a26be91b; }
    .prompt-icon { display: block; margin-bottom: 8px; color: #d6bdff; font-size: 16px; }
    .prompt strong { display: block; font-size: 13px; font-weight: 640; }
    .premium {
      position: relative;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-top: 15px;
      padding: 15px;
      border: 1px solid #c09aff34;
      border-radius: 18px;
      background: linear-gradient(115deg, #382552 0%, #281a3d 58%, #21152f 100%);
    }
    .premium:after { content: "\2726"; position: absolute; top: -19px; right: 74px; color: #dfc9ff0c; font-size: 79px; }
    .premium-copy { position: relative; z-index: 1; }
    .premium-label { color: #d2b4ff; font-size: 8px; font-weight: 730; letter-spacing: .17em; text-transform: uppercase; }
    .premium-title { margin-top: 6px; font-size: 12px; font-weight: 680; }
    .premium-button { position: relative; z-index: 1; flex: 0 0 auto; padding: 8px 10px; border: 1px solid #d5baff42; border-radius: 10px; color: #f2eaff; background: #ffffff09; font-size: 9px; cursor: pointer; }
    .local-chat { display: grid; gap: 8px; margin-top: 14px; }
    .local-chat[hidden] { display: none; }
    .local-row { display: flex; }
    .local-row.user { justify-content: flex-end; }
    .local-bubble { max-width: 86%; padding: 10px 12px; border: 1px solid var(--line); border-radius: 14px 14px 14px 5px; color: #d9d0e3; background: var(--surface-soft); font-size: 14px; line-height: 1.55; white-space: pre-wrap; overflow-wrap: anywhere; }
    .local-row.user .local-bubble { border-color: #b58cff3a; border-radius: 14px 14px 5px 14px; color: #f6efff; background: linear-gradient(135deg, #543776, #40285f); }
    .composer { margin-top: auto; padding-top: 14px; }
    .composer-label { display: block; margin: 0 0 8px 2px; color: #8e829c; font-size: 9px; }
    .input-wrap { display: flex; align-items: flex-end; gap: 9px; padding: 7px; border: 1px solid #cbaaff27; border-radius: 17px; background: #1b1428; box-shadow: 0 11px 35px #00000028; transition: border-color .15s, box-shadow .15s; }
    .input-wrap:focus-within { border-color: #b98eff77; box-shadow: 0 0 0 3px #a174dc17, 0 11px 35px #00000028; }
    textarea { min-height: 37px; max-height: 105px; flex: 1; resize: none; border: 0; outline: 0; padding: 9px 7px; color: var(--text); background: transparent; font-size: 16px; line-height: 1.5; }
    textarea::placeholder { color: #83768f; }
    .send { display: grid; width: 44px; height: 44px; flex: 0 0 44px; place-items: center; border: 0; border-radius: 12px; color: white; background: linear-gradient(145deg, #c099ff, #8753d5); box-shadow: 0 5px 16px #9a61d745; font-size: 18px; cursor: pointer; }
    .send:active { transform: scale(.96); }
    .send:disabled, .chat-action:disabled { opacity: .6; cursor: wait; }
    .chat-action { display: block; padding: 5px 8px; border: 1px solid var(--line); border-radius: 8px; color: var(--text); background: transparent; font: inherit; cursor: pointer; }
    .chat-action[hidden] { display: none; }
    .copy { margin-top: 8px; font-size: 10px; }
    .hint { padding: 9px 0 1px; color: var(--muted); text-align: center; font-size: 11px; }
    .toast { position: fixed; z-index: 10; right: 18px; bottom: max(24px, env(safe-area-inset-bottom)); left: 18px; width: fit-content; max-width: calc(100vw - 36px); margin: auto; padding: 11px 14px; border: 1px solid var(--line); border-radius: 12px; color: var(--text); background: #2a2039; box-shadow: 0 10px 30px #0005; font-size: 11px; opacity: 0; transform: translateY(8px); transition: .2s; pointer-events: none; }
    .toast.show { opacity: 1; transform: translateY(0); }
    .modal-backdrop { position: fixed; z-index: 20; inset: 0; display: none; place-items: end center; padding: 12px; background: #08050c99; backdrop-filter: blur(6px); }
    .modal-backdrop.show { display: grid; }
    .modal { width: min(100%, 480px); padding: 22px; border: 1px solid #d6baff2c; border-radius: 23px; background: linear-gradient(150deg, #2a1d3d, #171123); box-shadow: 0 22px 70px #0008; animation: rise .2s ease-out; }
    .modal-mark { color: #c9a6ff; font-size: 20px; }
    .modal h2 { margin: 8px 0 7px; font-size: 19px; letter-spacing: -.025em; }
    .modal p { margin: 0; color: #b2a6c0; font-size: 11px; line-height: 1.6; }
    .modal-close { width: 100%; margin-top: 17px; padding: 11px; border: 1px solid #d6baff30; border-radius: 12px; color: #eee4fb; background: #ffffff08; font-size: 11px; cursor: pointer; }
    @keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    @media (max-height: 700px) { .hero { padding-top: 27px; } .prompt { min-height: 73px; } }
    @media (prefers-reduced-motion: reduce) { *, *:before, *:after { animation-duration: .01ms !important; transition-duration: .01ms !important; } }
  </style>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand">
        <img class="logo" src="logo.svg" alt="E Premium logo">
        <div><div class="brand-name">E PREMIUM</div><div class="brand-note">বাংলা AI সহকারী</div></div>
      </div>
      <button class="chat-action" id="reset-chat" type="button" hidden>নতুন চ্যাট</button>
    </header>
    <main>
      <section class="hero">
        <h1 id="greeting">কী নিয়ে <span>কথা বলবেন?</span></h1>
        <p class="intro">প্রশ্ন করুন, পোস্ট লিখুন বা কঠিন বিষয় সহজ করে বুঝে নিন।</p>
      </section>
      <div class="section-head"><div class="section-title">শর্টকাট</div></div>
      <section class="prompts" aria-label="শর্টকাট">
        <button class="prompt" data-prompt="আজকের জন্য একটি কাজের পরিকল্পনা বানাও। আমার কাজগুলো হলো "><span class="prompt-icon">&#9788;</span><strong>দিনের পরিকল্পনা</strong></button>
        <button class="prompt" data-prompt="বাংলায় অনুবাদ করো: "><span class="prompt-icon">&#10038;</span><strong>অনুবাদ করো</strong></button>
        <button class="prompt" data-prompt="সহজ করে বোঝাও: "><span class="prompt-icon">&#9672;</span><strong>সহজ করে বোঝাও</strong></button>
        <button class="prompt" data-prompt="এই বিষয়ে একটি পোস্ট লেখো: "><span class="prompt-icon">&#9998;</span><strong>পোস্ট লেখো</strong></button>
      </section>
      <section class="premium" aria-label="Premium সাবস্ক্রিপশন">
        <div class="premium-copy"><div class="premium-label">&#10022; &nbsp; E Premium</div><div class="premium-title">সাবস্ক্রিপশন আসছে</div></div>
        <button class="premium-button" id="premium-button" type="button">দেখুন</button>
      </section>
      <section class="local-chat" id="local-chat" aria-live="polite" hidden></section>
    </main>
    <section class="composer" aria-label="Message composer">
      <label class="composer-label" for="message-input">আপনার মেসেজ</label>
      <form class="input-wrap" id="message-form">
        <textarea id="message-input" rows="1" maxlength="4000" placeholder="এখানে লিখুন…"></textarea>
        <button class="send" type="submit" aria-label="পাঠান">&#8593;</button>
      </form>
      <div class="hint" id="mode-hint"></div>
    </section>
  </div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <div class="modal-backdrop" id="premium-modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <div class="modal"><div class="modal-mark">&#10022;</div><h2 id="modal-title">Premium</h2><p>সাবস্ক্রিপশন চালু হলে এখানে প্ল্যানের তথ্য দেখা যাবে।</p><button class="modal-close" id="modal-close" type="button">বন্ধ করুন</button></div>
  </div>
  <script>
    const tg = window.Telegram && window.Telegram.WebApp;
    const inTelegram = Boolean(tg && typeof tg.initData === 'string' && tg.initData.length > 0);
    const sendToTelegram = !inTelegram && Boolean(tg && (
      new URLSearchParams(location.search).get('epremium_mode') === 'telegram'
      || (tg.platform && tg.platform !== 'unknown')
    ));
    const input = document.getElementById('message-input');
    const form = document.getElementById('message-form');
    const toast = document.getElementById('toast');
    const modal = document.getElementById('premium-modal');
    const localChat = document.getElementById('local-chat');
    const modeHint = document.getElementById('mode-hint');
    const sendButton = form.querySelector('.send');
    const resetButton = document.getElementById('reset-chat');
    const chatUrl = './chat';
    let toastTimer;

    if (inTelegram || sendToTelegram) {
      tg.ready();
      tg.expand();
      if (tg.setHeaderColor) tg.setHeaderColor('#100b1c');
      if (tg.setBackgroundColor) tg.setBackgroundColor('#100b1c');
      const firstName = tg.initDataUnsafe && tg.initDataUnsafe.user && tg.initDataUnsafe.user.first_name;
      if (firstName) {
        document.getElementById('greeting').textContent = 'স্বাগতম, ' + firstName + '!';
      }
    }
    if (sendToTelegram) {
      modeHint.textContent = 'উত্তর Telegram চ্যাটে আসবে।';
    } else if (!inTelegram) {
      modeHint.textContent = 'ডেমো প্রিভিউ · এখানে আপনার মেসেজই ফেরত আসবে।';
    }
    function showToast(text) {
      toast.textContent = text;
      toast.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => toast.classList.remove('show'), 2300);
    }
    function addChatMessage(text, kind, scroll = true) {
      localChat.hidden = false;
      const row = document.createElement('div');
      row.className = 'local-row ' + kind;
      const bubble = document.createElement('div');
      bubble.className = 'local-bubble';
      bubble.textContent = text;
      row.appendChild(bubble);
      if (kind === 'bot') {
        const copy = document.createElement('button');
        copy.className = 'chat-action copy';
        copy.type = 'button';
        copy.textContent = 'কপি করুন';
        copy.addEventListener('click', async () => {
          try {
            await navigator.clipboard.writeText(text);
            showToast('উত্তর কপি হয়েছে।');
          } catch {
            showToast('লেখাটি সিলেক্ট করে কপি করুন।');
          }
        });
        bubble.appendChild(copy);
      }
      localChat.appendChild(row);
      if (scroll) row.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
      return row;
    }

    async function telegramChat(method, text) {
      const headers = { Authorization: 'tma ' + tg.initData };
      const options = { method, headers, cache: 'no-store' };
      if (method === 'POST') {
        headers['Content-Type'] = 'application/json';
        options.body = JSON.stringify({ text });
      }
      const response = await fetch(chatUrl, options);
      if (response.status === 204) return;
      const data = await response.json();
      if (!response.ok) throw new Error(data.error || 'Mini App-এ উত্তর পাওয়া যাচ্ছে না।');
      return data;
    }

    function setBusy(busy) {
      sendButton.disabled = busy;
      resetButton.disabled = busy;
      sendButton.textContent = busy ? '…' : '↑';
    }

    async function loadChat() {
      setBusy(true);
      try {
        const { messages } = await telegramChat('GET');
        messages.forEach(message => {
          addChatMessage(message.content, message.role === 'user' ? 'user' : 'bot', false);
        });
      } catch {
        showToast('আগের মেসেজ লোড করা যায়নি।');
      } finally {
        setBusy(false);
      }
    }

    async function resetChat() {
      if (resetButton.disabled) return;
      setBusy(true);
      try {
        await telegramChat('DELETE');
        localChat.replaceChildren();
        localChat.hidden = true;
        showToast('নতুন চ্যাট শুরু হয়েছে।');
      } catch {
        showToast('চ্যাটের প্রসঙ্গ মুছতে সমস্যা হয়েছে। আবার চেষ্টা করুন।');
      } finally {
        setBusy(false);
      }
    }

    if (inTelegram) {
      resetButton.hidden = false;
      resetButton.addEventListener('click', () => {
        const question = 'আগের চ্যাটের প্রসঙ্গ মুছে নতুন চ্যাট শুরু করবেন?';
        if (tg.isVersionAtLeast && tg.isVersionAtLeast('6.2') && tg.showConfirm) {
          tg.showConfirm(question, confirmed => { if (confirmed) resetChat(); });
        } else if (window.confirm(question)) {
          resetChat();
        }
      });
      loadChat();
    }

    async function sendMessage(text) {
      const value = (text || '').trim();
      if (sendButton.disabled) return;
      if (!value) { input.focus(); return; }
      if (sendToTelegram) {
        const message = JSON.stringify({ type: 'message', text: value });
        if (new TextEncoder().encode(message).length > 4096) {
          showToast('মেসেজটি ছোট করে আবার পাঠান।');
          return;
        }
        try {
          tg.sendData(message);
        } catch {
          showToast('Telegram বটের বাটন থেকে Mini App আবার খুলুন।');
        }
        return;
      }
      const row = addChatMessage(value, 'user');
      input.value = '';
      input.style.height = 'auto';
      setBusy(true);
      try {
        let data;
        if (inTelegram) {
          data = await telegramChat('POST', value);
        } else {
          const response = await fetch('/message', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ text: value }),
          });
          if (!response.ok) throw new Error('ডেমো থেকে উত্তর পাওয়া যায়নি।');
          data = await response.json();
        }
        addChatMessage(data.reply, 'bot');
      } catch (error) {
        row.remove();
        localChat.hidden = !localChat.childElementCount;
        if (!input.value) input.value = value;
        showToast(error instanceof SyntaxError ? 'এখন উত্তর পাওয়া যাচ্ছে না।' : error.message);
      } finally {
        setBusy(false);
        input.focus();
      }
    }
    document.querySelectorAll('[data-prompt]').forEach(button => {
      button.addEventListener('click', () => {
        input.value = button.dataset.prompt;
        input.focus();
        input.setSelectionRange(input.value.length, input.value.length);
      });
    });
    form.addEventListener('submit', event => {
      event.preventDefault();
      sendMessage(input.value);
    });
    input.addEventListener('keydown', event => {
      if (event.key === 'Enter' && !event.shiftKey && !event.isComposing) { event.preventDefault(); form.requestSubmit(); }
    });
    input.addEventListener('input', () => {
      input.style.height = 'auto';
      input.style.height = Math.min(input.scrollHeight, 105) + 'px';
    });
    document.getElementById('premium-button').addEventListener('click', () => modal.classList.add('show'));
    document.getElementById('modal-close').addEventListener('click', () => modal.classList.remove('show'));
    modal.addEventListener('click', event => { if (event.target === modal) modal.classList.remove('show'); });
  </script>
</body>
</html>
