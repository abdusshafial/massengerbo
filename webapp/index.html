<!doctype html>
<html lang="bn">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#100d18">
  <title>E Premium</title>
  <script src="https://telegram.org/js/telegram-web-app.js?65"></script>
  <style>
    :root {
      color-scheme: dark;
      --bg: #100d18;
      --panel: #1b1626;
      --line: #b29aca38;
      --text: #faf7ff;
      --muted: #b7abc7;
      --accent: #d7bcff;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      color: var(--text);
      background: radial-gradient(ellipse at 50% 0%, #261b37, transparent 520px), var(--bg);
      font: 15px/1.55 "Noto Sans Bengali", "Nirmala UI", Inter, ui-sans-serif, system-ui, sans-serif;
    }
    button, textarea { font: inherit; }
    :focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
    .app {
      display: flex;
      width: min(100%, 620px);
      min-height: 100vh;
      min-height: 100dvh;
      flex-direction: column;
      margin: 0 auto;
      padding: max(17px, env(safe-area-inset-top)) 22px max(16px, env(safe-area-inset-bottom));
    }
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding-bottom: 15px;
      border-bottom: 1px solid var(--line);
    }
    .brand { display: flex; min-width: 0; align-items: center; gap: 11px; }
    .logo { width: 43px; height: 43px; flex: none; border-radius: 13px; box-shadow: 0 6px 20px #a97add30; }
    .brand-name { font: 750 15px/1.25 Inter, ui-sans-serif, system-ui, sans-serif; }
    .brand-note { margin-top: 3px; color: var(--muted); font-size: 12px; }
    main { flex: 1; padding-bottom: 12px; }
    .hero {
      position: relative;
      isolation: isolate;
      overflow: hidden;
      margin: 17px 0 21px;
      padding: clamp(22px, 5vw, 32px);
      border: 1px solid #bb9edf51;
      border-radius: 24px;
      background: radial-gradient(ellipse at 110% 5%, #673f89, transparent 70%), #261a37;
    }
    .hero::before, .hero::after {
      position: absolute;
      z-index: -1;
      width: 184px;
      height: 184px;
      border: 1px solid #ead5ff2d;
      border-radius: 50%;
      content: "";
    }
    .hero::before { top: -105px; right: -45px; }
    .hero::after { top: -121px; right: -65px; }
    h1 {
      margin: 0 0 10px;
      font-size: clamp(28px, 7.4vw, 43px);
      font-weight: 760;
      line-height: 1.27;
      overflow-wrap: anywhere;
    }
    h1 span { display: block; color: var(--accent); }
    .intro { max-width: 360px; margin: 0; color: #ddd0eb; font-size: 14px; line-height: 1.65; }
    .section-title { margin: 0 0 9px; color: var(--text); font-size: 15px; font-weight: 700; }
    .prompts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 9px; }
    .prompt {
      display: flex;
      min-height: 66px;
      align-items: center;
      gap: 9px;
      padding: 9px 10px;
      border: 1px solid var(--line);
      border-radius: 15px;
      color: var(--text);
      text-align: left;
      background: var(--panel);
      transition: transform .16s, border-color .16s, background .16s;
      cursor: pointer;
    }
    .prompt:hover { border-color: #c6a2ff7a; background: #291e38; }
    .prompt:active { transform: scale(.98); }
    .prompt-icon {
      display: grid;
      width: 32px;
      height: 32px;
      flex: 0 0 32px;
      place-items: center;
      border-radius: 10px;
      color: #e4cbff;
      background: #b482ef25;
      font-size: 17px;
      line-height: 1;
    }
    .prompt:nth-child(2) .prompt-icon { color: #a0e8dc; background: #72cfbe25; }
    .prompt:nth-child(3) .prompt-icon { color: #abcfff; background: #7aabef27; }
    .prompt:nth-child(4) .prompt-icon { color: #ffd2ad; background: #f2aa7524; }
    .prompt strong { font-size: 13px; font-weight: 650; overflow-wrap: anywhere; }
    .premium {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-top: 16px;
      padding: 11px 12px 11px 14px;
      border: 1px solid #ba95e34a;
      border-radius: 17px;
      background: linear-gradient(110deg, #332243, var(--panel));
    }
    .premium-label { color: var(--accent); font: 700 12px/1.35 Inter, ui-sans-serif, system-ui, sans-serif; }
    .premium-title { margin-top: 4px; color: var(--muted); font-size: 13px; }
    .premium-button, .chat-action, .modal-close {
      border: 1px solid var(--line);
      color: var(--text);
      background: #d7bcff0c;
      cursor: pointer;
      transition: border-color .16s, background .16s;
    }
    .premium-button:hover, .chat-action:hover, .modal-close:hover {
      border-color: #d7bcff8c;
      background: #d7bcff1a;
    }
    .premium-button { min-height: 44px; flex: none; padding: 0 12px; border-radius: 11px; font-size: 13px; }
    .local-chat { display: grid; gap: 10px; margin-top: 20px; }
    .local-chat[hidden], .chat-action[hidden], .hint:empty { display: none; }
    .local-row { display: flex; }
    .local-row.user { justify-content: flex-end; }
    .local-bubble {
      max-width: 90%;
      padding: 11px 14px;
      border: 1px solid var(--line);
      border-radius: 16px 16px 16px 5px;
      color: var(--text);
      background: #21192e;
      font-size: 15px;
      line-height: 1.65;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }
    .local-row.user .local-bubble {
      border-color: #c5a2ff55;
      border-radius: 16px 16px 5px 16px;
      background: #4d3569;
    }
    .composer { padding-top: 6px; }
    .composer-label { display: block; margin: 0 0 6px 2px; color: var(--muted); font-size: 13px; }
    .input-wrap {
      display: flex;
      align-items: flex-end;
      gap: 8px;
      padding: 6px;
      border: 1px solid #b99cd25a;
      border-radius: 17px;
      background: var(--panel);
      box-shadow: 0 12px 30px #07050d70;
      transition: border-color .16s, box-shadow .16s;
    }
    .input-wrap:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px #d7bcff24; }
    textarea {
      min-width: 0;
      min-height: 44px;
      max-height: 105px;
      flex: 1;
      resize: none;
      border: 0;
      outline: 0;
      padding: 10px 8px;
      color: var(--text);
      background: transparent;
      font-size: 16px;
      line-height: 1.5;
    }
    textarea:focus-visible { outline: 0; }
    textarea::placeholder { color: var(--muted); }
    .send {
      display: grid;
      width: 44px;
      height: 44px;
      flex: 0 0 44px;
      place-items: center;
      border: 0;
      border-radius: 11px;
      color: #241535;
      background: var(--accent);
      font-size: 22px;
      cursor: pointer;
      transition: background .16s, transform .16s;
    }
    .send:hover:not(:disabled) { background: #ead9ff; }
    .send:active:not(:disabled) { transform: scale(.95); }
    .send:disabled, .chat-action:disabled { opacity: .6; cursor: wait; }
    .chat-action { display: block; min-height: 44px; padding: 6px 10px; border-radius: 10px; font-size: 12px; }
    .copy { margin-top: 7px; }
    .hint { padding: 8px 0 0; color: var(--muted); text-align: center; font-size: 12px; }
    .toast {
      position: fixed;
      z-index: 10;
      right: 14px;
      bottom: max(20px, env(safe-area-inset-bottom));
      left: 14px;
      width: fit-content;
      margin: auto;
      padding: 11px 14px;
      border: 1px solid var(--line);
      border-radius: 12px;
      color: var(--text);
      background: #30243f;
      box-shadow: 0 10px 30px #0006;
      font-size: 13px;
      opacity: 0;
      transform: translateY(8px);
      transition: opacity .16s, transform .16s;
      pointer-events: none;
    }
    .toast.show { opacity: 1; transform: translateY(0); }
    .modal-backdrop {
      position: fixed;
      z-index: 20;
      inset: 0;
      display: none;
      place-items: end center;
      padding: 12px 12px max(12px, env(safe-area-inset-bottom));
      background: #08050cb8;
      backdrop-filter: blur(6px);
    }
    .modal-backdrop.show { display: grid; }
    .modal {
      width: min(100%, 480px);
      padding: 22px;
      border: 1px solid #d6baff57;
      border-radius: 23px;
      background: linear-gradient(150deg, #332343, var(--panel));
      box-shadow: 0 22px 70px #0008;
      animation: rise .2s ease-out;
    }
    .modal-mark { color: var(--accent); font-size: 22px; }
    .modal h2 { margin: 5px 0 7px; font-size: 23px; }
    .modal p { margin: 0; color: var(--muted); font-size: 14px; line-height: 1.65; }
    .modal-close { width: 100%; min-height: 44px; margin-top: 16px; border-radius: 11px; font-size: 14px; }
    @keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    @media (min-width: 650px) { .modal-backdrop { place-items: center; } }
    @media (max-width: 370px) {
      .app { padding-right: 14px; padding-left: 14px; }
      .prompt { gap: 7px; padding: 8px; }
      .prompt-icon { width: 28px; height: 28px; flex-basis: 28px; }
    }
    @media (max-height: 720px) { .hero { padding-top: 17px; padding-bottom: 17px; } }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand">
        <img class="logo" src="logo.svg" alt="">
        <div><div class="brand-name">E Premium</div><div class="brand-note">বাংলা AI সহকারী</div></div>
      </div>
      <button class="chat-action" id="reset-chat" type="button" hidden>নতুন চ্যাট</button>
    </header>
    <main>
      <section class="hero">
        <h1 id="greeting">কী নিয়ে <span>কথা বলবেন?</span></h1>
        <p class="intro">প্রশ্ন করুন, পোস্ট লিখুন বা কঠিন বিষয় সহজ করে বুঝে নিন।</p>
      </section>
      <h2 class="section-title" id="shortcut-title">শর্টকাট</h2>
      <section class="prompts" aria-labelledby="shortcut-title">
        <button class="prompt" type="button" data-prompt="আজকের জন্য একটি কাজের পরিকল্পনা বানাও। আমার কাজগুলো হলো "><span class="prompt-icon" aria-hidden="true">&#9788;</span><strong>দিনের পরিকল্পনা</strong></button>
        <button class="prompt" type="button" data-prompt="বাংলায় অনুবাদ করো: "><span class="prompt-icon" aria-hidden="true">&#10038;</span><strong>অনুবাদ করো</strong></button>
        <button class="prompt" type="button" data-prompt="সহজ করে বোঝাও: "><span class="prompt-icon" aria-hidden="true">&#9672;</span><strong>সহজ করে বোঝাও</strong></button>
        <button class="prompt" type="button" data-prompt="এই বিষয়ে একটি পোস্ট লেখো: "><span class="prompt-icon" aria-hidden="true">&#9998;</span><strong>পোস্ট লেখো</strong></button>
      </section>
      <section class="premium" aria-label="Premium সাবস্ক্রিপশন">
        <div class="premium-copy"><div class="premium-label">&#10022; &nbsp; E Premium</div><div class="premium-title">সাবস্ক্রিপশন আসছে</div></div>
        <button class="premium-button" id="premium-button" type="button">দেখুন</button>
      </section>
      <section class="local-chat" id="local-chat" aria-live="polite" hidden></section>
    </main>
    <section class="composer" aria-label="Message composer">
      <label class="composer-label" for="message-input">আপনার মেসেজ</label>
      <form class="input-wrap" id="message-form">
        <textarea id="message-input" rows="1" maxlength="4000" placeholder="এখানে লিখুন…"></textarea>
        <button class="send" type="submit" aria-label="পাঠান">&#8593;</button>
      </form>
      <div class="hint" id="mode-hint"></div>
    </section>
  </div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <div class="modal-backdrop" id="premium-modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <div class="modal"><div class="modal-mark" aria-hidden="true">&#10022;</div><h2 id="modal-title">Premium</h2><p>সাবস্ক্রিপশন চালু হলে এখানে প্ল্যানের তথ্য দেখা যাবে।</p><button class="modal-close" id="modal-close" type="button">বন্ধ করুন</button></div>
  </div>
  <script>
    const tg = window.Telegram && window.Telegram.WebApp;
    const inTelegram = Boolean(tg && typeof tg.initData === 'string' && tg.initData.length > 0);
    const sendToTelegram = !inTelegram && Boolean(tg && (
      new URLSearchParams(location.search).get('epremium_mode') === 'telegram'
      || (tg.platform && tg.platform !== 'unknown')
    ));
    const input = document.getElementById('message-input');
    const form = document.getElementById('message-form');
    const toast = document.getElementById('toast');
    const modal = document.getElementById('premium-modal');
    const localChat = document.getElementById('local-chat');
    const modeHint = document.getElementById('mode-hint');
    const sendButton = form.querySelector('.send');
    const resetButton = document.getElementById('reset-chat');
    const chatUrl = './chat';
    let toastTimer;

    if (inTelegram || sendToTelegram) {
      tg.ready();
      tg.expand();
      if (tg.setHeaderColor) tg.setHeaderColor('#100d18');
      if (tg.setBackgroundColor) tg.setBackgroundColor('#100d18');
      const firstName = tg.initDataUnsafe && tg.initDataUnsafe.user && tg.initDataUnsafe.user.first_name;
      if (firstName) {
        document.getElementById('greeting').textContent = 'স্বাগতম, ' + firstName + '!';
      }
    }
    if (sendToTelegram) {
      modeHint.textContent = 'উত্তর Telegram চ্যাটে আসবে।';
    } else if (!inTelegram) {
      modeHint.textContent = 'ডেমো প্রিভিউ · এখানে আপনার মেসেজই ফেরত আসবে।';
    }
    function showToast(text) {
      toast.textContent = text;
      toast.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => toast.classList.remove('show'), 2300);
    }
    function addChatMessage(text, kind, scroll = true) {
      localChat.hidden = false;
      const row = document.createElement('div');
      row.className = 'local-row ' + kind;
      const bubble = document.createElement('div');
      bubble.className = 'local-bubble';
      bubble.textContent = text;
      row.appendChild(bubble);
      if (kind === 'bot') {
        const copy = document.createElement('button');
        copy.className = 'chat-action copy';
        copy.type = 'button';
        copy.textContent = 'কপি করুন';
        copy.addEventListener('click', async () => {
          try {
            await navigator.clipboard.writeText(text);
            showToast('উত্তর কপি হয়েছে।');
          } catch {
            showToast('লেখাটি সিলেক্ট করে কপি করুন।');
          }
        });
        bubble.appendChild(copy);
      }
      localChat.appendChild(row);
      if (scroll) row.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
      return row;
    }

    async function telegramChat(method, text) {
      const headers = { Authorization: 'tma ' + tg.initData };
      const options = { method, headers, cache: 'no-store' };
      if (method === 'POST') {
        headers['Content-Type'] = 'application/json';
        options.body = JSON.stringify({ text });
      }
      const response = await fetch(chatUrl, options);
      if (response.status === 204) return;
      const data = await response.json();
      if (!response.ok) throw new Error(data.error || 'Mini App-এ উত্তর পাওয়া যাচ্ছে না।');
      return data;
    }

    function setBusy(busy) {
      sendButton.disabled = busy;
      resetButton.disabled = busy;
      sendButton.textContent = busy ? '…' : '↑';
    }

    async function loadChat() {
      setBusy(true);
      try {
        const { messages } = await telegramChat('GET');
        messages.forEach(message => {
          addChatMessage(message.content, message.role === 'user' ? 'user' : 'bot', false);
        });
      } catch {
        showToast('আগের মেসেজ লোড করা যায়নি।');
      } finally {
        setBusy(false);
      }
    }

    async function resetChat() {
      if (resetButton.disabled) return;
      setBusy(true);
      try {
        await telegramChat('DELETE');
        localChat.replaceChildren();
        localChat.hidden = true;
        showToast('নতুন চ্যাট শুরু হয়েছে।');
      } catch {
        showToast('চ্যাটের প্রসঙ্গ মুছতে সমস্যা হয়েছে। আবার চেষ্টা করুন।');
      } finally {
        setBusy(false);
      }
    }

    if (inTelegram) {
      resetButton.hidden = false;
      resetButton.addEventListener('click', () => {
        const question = 'আগের চ্যাটের প্রসঙ্গ মুছে নতুন চ্যাট শুরু করবেন?';
        if (tg.isVersionAtLeast && tg.isVersionAtLeast('6.2') && tg.showConfirm) {
          tg.showConfirm(question, confirmed => { if (confirmed) resetChat(); });
        } else if (window.confirm(question)) {
          resetChat();
        }
      });
      loadChat();
    }

    async function sendMessage(text) {
      const value = (text || '').trim();
      if (sendButton.disabled) return;
      if (!value) { input.focus(); return; }
      if (sendToTelegram) {
        const message = JSON.stringify({ type: 'message', text: value });
        if (new TextEncoder().encode(message).length > 4096) {
          showToast('মেসেজটি ছোট করে আবার পাঠান।');
          return;
        }
        try {
          tg.sendData(message);
        } catch {
          showToast('Telegram বটের বাটন থেকে Mini App আবার খুলুন।');
        }
        return;
      }
      const row = addChatMessage(value, 'user');
      input.value = '';
      input.style.height = 'auto';
      setBusy(true);
      try {
        let data;
        if (inTelegram) {
          data = await telegramChat('POST', value);
        } else {
          const response = await fetch('/message', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ text: value }),
          });
          if (!response.ok) throw new Error('ডেমো থেকে উত্তর পাওয়া যায়নি।');
          data = await response.json();
        }
        addChatMessage(data.reply, 'bot');
      } catch (error) {
        row.remove();
        localChat.hidden = !localChat.childElementCount;
        if (!input.value) input.value = value;
        showToast(error instanceof SyntaxError ? 'এখন উত্তর পাওয়া যাচ্ছে না।' : error.message);
      } finally {
        setBusy(false);
        input.focus();
      }
    }
    document.querySelectorAll('[data-prompt]').forEach(button => {
      button.addEventListener('click', () => {
        input.value = button.dataset.prompt;
        input.focus();
        input.setSelectionRange(input.value.length, input.value.length);
      });
    });
    form.addEventListener('submit', event => {
      event.preventDefault();
      sendMessage(input.value);
    });
    input.addEventListener('keydown', event => {
      if (event.key === 'Enter' && !event.shiftKey && !event.isComposing) { event.preventDefault(); form.requestSubmit(); }
    });
    input.addEventListener('input', () => {
      input.style.height = 'auto';
      input.style.height = Math.min(input.scrollHeight, 105) + 'px';
    });
    document.getElementById('premium-button').addEventListener('click', () => modal.classList.add('show'));
    document.getElementById('modal-close').addEventListener('click', () => modal.classList.remove('show'));
    modal.addEventListener('click', event => { if (event.target === modal) modal.classList.remove('show'); });
  </script>
</body>
</html>
