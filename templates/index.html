<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#11101b">
  <title>MessengerBo | Inbox preview</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #11101b;
      --panel: #1b1929;
      --text: #f8f5ff;
      --muted: #b5adc9;
      --line: #ae9bda38;
      --accent: #d5c2ff;
      --green: #8ce5bc;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      color: var(--text);
      background: radial-gradient(ellipse at 12% 12%, #34264a, transparent 52%), var(--bg);
      font: 15px/1.55 Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    }
    button, input { font: inherit; }
    a { color: inherit; }
    :focus-visible { outline: 2px solid var(--accent); outline-offset: 4px; }
    .shell { width: min(100% - 64px, 1180px); margin: 0 auto; }
    .topbar {
      display: flex;
      min-height: 84px;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      border-bottom: 1px solid var(--line);
    }
    .brand, .contact { display: flex; align-items: center; gap: 12px; }
    .brand-name { font-weight: 750; letter-spacing: -.025em; }
    .brand-mark, .avatar, .mini-avatar {
      display: grid;
      flex: none;
      place-items: center;
      color: #211331;
      background: linear-gradient(145deg, #e9dcff, #bca1fa 76%);
      font-weight: 800;
    }
    .brand-mark { width: 42px; height: 42px; border-radius: 14px; box-shadow: inset 0 1px #fff9, 0 8px 22px #a97add2d; }
    .miniapp-link {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      min-height: 44px;
      padding: 0 14px;
      border: 1px solid var(--line);
      border-radius: 12px;
      color: #f2d49d;
      background: #e2b96c0b;
      font-size: 13px;
      font-weight: 650;
      text-decoration: none;
      transition: background .16s, border-color .16s;
    }
    .miniapp-link:hover { border-color: #edc98e83; background: #e2b96c20; }
    .layout {
      display: grid;
      grid-template-columns: minmax(0, 4fr) minmax(0, 6fr);
      align-items: center;
      gap: clamp(32px, 6vw, 90px);
      padding: clamp(54px, 9vw, 120px) 0 52px;
    }
    h1 {
      margin: 0 0 22px;
      font-size: clamp(50px, 6vw, 88px);
      font-weight: 760;
      line-height: .98;
      letter-spacing: -.075em;
    }
    h1 span { display: block; color: var(--accent); }
    .overview { position: relative; isolation: isolate; }
    .overview::before {
      position: absolute;
      z-index: -1;
      top: -28px;
      left: -26px;
      width: min(100%, 370px);
      height: 280px;
      background: radial-gradient(ellipse, #9e6de51f, transparent 72%);
      content: "";
      pointer-events: none;
    }
    .intro { max-width: 310px; margin: 0; color: var(--muted); font-size: 16px; line-height: 1.7; }
    .mode {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin: 30px 0 0;
      padding: 7px 11px;
      border: 1px solid #8ce5bc38;
      border-radius: 999px;
      color: var(--green);
      background: #8ce5bc0c;
      font-size: 12px;
      font-weight: 650;
    }
    .mode::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
    .conversation {
      min-width: 0;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 27px;
      background: linear-gradient(165deg, #211b31, #171523 68%);
      box-shadow: inset 0 1px #f1ddff16, 0 28px 70px #07050d80;
    }
    .conversation-head {
      padding: 16px 20px;
      border-bottom: 1px solid var(--line);
      background: linear-gradient(110deg, #c0a6ff12, #c0a6ff05);
    }
    .avatar { width: 42px; height: 42px; border-radius: 14px; }
    .contact-name { margin: 0; font-size: 15px; font-weight: 730; }
    .contact-status { margin: 2px 0 0; color: var(--muted); font-size: 12px; }
    .messages {
      display: flex;
      flex-direction: column;
      gap: 16px;
      height: clamp(240px, 46vh, 400px);
      overscroll-behavior-y: contain;
      overflow-y: auto;
      padding: 22px 20px 20px;
      scrollbar-color: #625075 transparent;
    }
    .day {
      display: flex;
      align-items: center;
      gap: 12px;
      color: var(--muted);
      font-size: 11px;
      font-weight: 650;
    }
    .day::before, .day::after { height: 1px; flex: 1; background: var(--line); content: ""; }
    .message-row { display: flex; align-items: flex-end; gap: 9px; }
    .message-row.user { justify-content: flex-end; }
    .bubble {
      max-width: min(86%, 420px);
      padding: 11px 14px;
      border: 1px solid var(--line);
      border-radius: 16px 16px 16px 5px;
      color: var(--text);
      background: #282139;
      font-size: 14px;
      overflow-wrap: anywhere;
      white-space: pre-wrap;
    }
    .bubble.user {
      border-color: #c9a4ff4d;
      border-radius: 16px 16px 5px 16px;
      background: #4a3569;
    }
    .time { display: block; margin-top: 4px; color: #c2b5d1; text-align: right; font-size: 10px; }
    .mini-avatar { width: 27px; height: 27px; border-radius: 9px; font-size: 11px; }
    .composer { padding: 14px; border-top: 1px solid var(--line); background: #171422; }
    .form {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 6px 6px 6px 14px;
      border: 1px solid var(--line);
      border-radius: 15px;
      background: var(--panel);
      transition: border-color .16s, box-shadow .16s;
    }
    .form:focus-within { border-color: #c6a2ff; box-shadow: 0 0 0 3px #c6a2ff24; }
    .form input {
      min-width: 0;
      min-height: 44px;
      flex: 1;
      border: 0;
      outline: 0;
      color: var(--text);
      background: transparent;
      font-size: 16px;
    }
    .form input::placeholder { color: #a398b3; }
    .send {
      display: grid;
      width: 44px;
      height: 44px;
      flex: none;
      place-items: center;
      border: 0;
      border-radius: 11px;
      color: #241535;
      background: linear-gradient(145deg, #e9dcff, #bca1fa 76%);
      box-shadow: inset 0 1px #fff9, 0 4px 13px #bc9aff25;
      font-size: 23px;
      line-height: 1;
      cursor: pointer;
      transition: filter .16s, transform .16s;
    }
    .send:hover:not(:disabled) { filter: brightness(1.09); }
    .send:active:not(:disabled) { transform: scale(.95); }
    .send:disabled { opacity: .6; cursor: wait; }
    @media (max-width: 760px) {
      .shell { width: min(100% - 40px, 560px); }
      .topbar { min-height: 70px; }
      .layout { grid-template-columns: 1fr; gap: 25px; padding: 34px 0 28px; }
      h1 { margin-bottom: 12px; font-size: clamp(42px, 10vw, 64px); }
      h1 span { display: inline; }
      .intro { max-width: 390px; font-size: 14px; }
      .mode { margin-top: 16px; }
    }
    @media (max-width: 380px) {
      .shell { width: calc(100% - 28px); }
      .brand, .contact { gap: 9px; }
      .miniapp-link { padding: 0 10px; }
      .conversation-head, .messages { padding-right: 13px; padding-left: 13px; }
      .composer { padding: 10px; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <header class="shell topbar">
    <div class="brand"><span class="brand-mark" aria-hidden="true">M</span><span class="brand-name">MessengerBo</span></div>
    <a class="miniapp-link" href="{{ url_for('miniapp_index') }}">E Premium <span aria-hidden="true">&#8599;</span></a>
  </header>
  <main class="shell layout">
    <section class="overview" aria-labelledby="page-title">
      <h1 id="page-title">Messenger <span>preview</span></h1>
      <p class="intro">Send a message to see how replies appear in the conversation.</p>
      <p class="mode">Local demo</p>
    </section>
    <section class="conversation" aria-labelledby="conversation-title">
      <header class="conversation-head">
        <div class="contact">
          <div class="avatar" aria-hidden="true">M</div>
          <div><h2 class="contact-name" id="conversation-title">MessengerBo Assistant</h2><p class="contact-status">Echoes your messages</p></div>
        </div>
      </header>
      <div class="messages" id="messages" role="log" aria-label="Conversation messages">
        <div class="day">Today</div>
        <div class="message-row"><div class="mini-avatar" aria-hidden="true">M</div><div class="bubble bot">Hi! Send a message to try the chat.<span class="time">Just now</span></div></div>
      </div>
      <div class="composer">
        <form class="form" id="message-form">
          <input id="message-input" type="text" placeholder="Write a message..." autocomplete="off" maxlength="2000" aria-label="Write a message">
          <button class="send" id="send-button" type="submit" aria-label="Send message">&#8593;</button>
        </form>
      </div>
    </section>
  </main>
  <script>
    const form = document.getElementById('message-form');
    const input = document.getElementById('message-input');
    const messages = document.getElementById('messages');
    const sendButton = document.getElementById('send-button');

    function addBubble(text, kind, label) {
      const row = document.createElement('div');
      row.className = `message-row ${kind === 'user' ? 'user' : ''}`;
      if (kind === 'bot') {
        const avatar = document.createElement('div');
        avatar.className = 'mini-avatar';
        avatar.setAttribute('aria-hidden', 'true');
        avatar.textContent = 'M';
        row.appendChild(avatar);
      }
      const bubble = document.createElement('div');
      bubble.className = `bubble ${kind}`;
      bubble.append(document.createTextNode(text));
      const time = document.createElement('span');
      time.className = 'time';
      time.textContent = label || new Date().toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
      bubble.appendChild(time);
      row.appendChild(bubble);
      messages.appendChild(row);
      messages.scrollTop = messages.scrollHeight;
      return row;
    }

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      const text = input.value.trim();
      if (!text || sendButton.disabled) return;
      addBubble(text, 'user');
      input.value = '';
      sendButton.disabled = true;
      const pending = addBubble('Thinking...', 'bot', '');
      try {
        const response = await fetch('/message', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ text }),
        });
        const data = await response.json();
        pending.remove();
        addBubble(data.reply || 'No response received.', 'bot');
      } catch (error) {
        pending.remove();
        addBubble('Could not reach the app. Check that the server is running and try again.', 'bot');
      } finally {
        sendButton.disabled = false;
        input.focus();
      }
    });
  </script>
</body>
</html>
